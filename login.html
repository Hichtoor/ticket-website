<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود به حساب کاربری | دانشگاه تربت حیدریه</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth">
    <aside class="auth__side">
      <svg class="hero__pattern" aria-hidden="true" focusable="false">
        <defs>
          <pattern id="khatam2" width="56" height="56" patternUnits="userSpaceOnUse">
            <rect x="14" y="14" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <rect x="14" y="14" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" transform="rotate(45 28 28)"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#khatam2)"/>
      </svg>
      <img src="logo-white.png" alt="لوگوی دانشگاه تربت حیدریه" width="144" height="128">
      <h1>به سامانه بلیت رویدادهای دانشگاه خوش آمدید</h1>
      <p>وارد حساب خود شوید تا بلیت‌هایتان را ببینید، سفارش‌های قبلی را پیگیری کنید و سریع‌تر خرید کنید.</p>
      <a class="auth__back" href="index.html">← بازگشت به صفحه اصلی</a>
    </aside>

    <main class="auth__main">
      <section class="auth__card" aria-labelledby="loginTitle">
        <h2 id="loginTitle">ورود به حساب کاربری</h2>
        <p>شماره موبایل یا ایمیل و رمز عبور خود را وارد کنید.</p>

        <form class="form" id="loginForm" novalidate>
          <div class="field">
            <label for="l-id">شماره موبایل یا ایمیل</label>
            <input id="l-id" name="identifier" type="text" dir="ltr" autocomplete="username" placeholder="09123456789" aria-describedby="err-identifier">
            <p class="error" id="err-identifier" role="alert"></p>
          </div>
          <div class="field">
            <label for="l-pw">رمز عبور</label>
            <div class="pw">
              <input id="l-pw" name="password" type="password" dir="ltr" autocomplete="current-password" aria-describedby="err-password">
              <button type="button" id="pwToggle" aria-controls="l-pw" aria-pressed="false">نمایش</button>
            </div>
            <p class="error" id="err-password" role="alert"></p>
          </div>
          <div class="auth__row">
            <label><input type="checkbox" name="remember"> مرا به خاطر بسپار</label>
            <a href="#">رمز عبور را فراموش کرده‌اید؟</a>
          </div>
          <button class="btn btn--block" type="submit">ورود</button>
          <p class="form-msg" id="formMsg" role="status" hidden></p>
        </form>

        <p class="auth__alt">حساب کاربری ندارید؟ <a href="#">ثبت‌نام</a></p>
      </section>
    </main>
  </div>
  <script src="login.js"></script>
</body>
